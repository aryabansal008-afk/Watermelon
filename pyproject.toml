[project]
name = "watermelon-memory"
version = "0.1.0"
description = "Evidence-grounded engineering memory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3.6,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "redis>=5.2,<8", "rq>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3", "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24", "beautifulsoup4>=4.13,<5"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "respx>=0.22,<1", "fakeredis>=2.27,<3", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL", "live: opt-in network tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
